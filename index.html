r proteico, plátano y nueces",425,27,46,13],["Sándwich integral de pavo y fruta",420,29,48,9],["Tortitas de arroz, crema de cacahuete y yogur",435,26,49,14],["Hummus, pan integral, pavo y tomate",430,27,51,11],["Batido de leche, avena, proteína y fruta",440,30,53,9]],d:[["Merluza, patata y verduras",720,42,78,24],["Tortilla, pan integral, ensalada y aguacate",725,40,72,27],["Pollo, arroz y verduras",715,45,82,20],["Ternera, patata y brócoli",730,44,76,25],["Salmón, quinoa y verduras",735,41,70,29],["Hamburguesa magra, patata y ensalada",735,43,79,26]]},guide:[["Press inclinado","Banco a 20–30°. Escápulas estables. Baja controlado. No encoger hombros."],["Dominadas asistidas","Inicia con las escápulas y lleva los codos hacia las costillas. Sin balanceo."],["Remo con barra","Espalda neutra, cadera atrás y barra al abdomen. Evita tirones."],["Elevación lateral","Eleva desde el codo y evita encoger trapecios. Técnica antes que carga."],["Hack squat","Rodillas siguen la línea de los pies. Recorrido sin dolor y pelvis estable."],["Peso muerto rumano","Cadera atrás, barra pegada y tensión en isquios. No busques tocar el suelo."],["Curl Scott","Brazos apoyados y bajada controlada. No rebotes abajo."],["Tríceps sobre cabeza","Codos estables, buen estiramiento y zona lumbar neutra."],["Crunch en polea","Acerca costillas a pelvis. Progresa con carga como cualquier músculo."]]} ;
const G=(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},S=(k,v)=>localStorage.setItem(k,JSON.stringify(v)),date=()=>new Date().toISOString().slice(0,10),wd=()=>{let n=new Date().getDay();return n>=1&&n<=4?n:0};
function go(p){document.querySelectorAll('.page').forEach(x=>x.classList.toggle('active',x.id===p));document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x.dataset.p===p));({home:home,training:()=>training(),nutrition:nutrition,progress:progress,guide:guide}[p])();scrollTo(0,0)}document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.p));
function home(){let d=wd(),m=G('metrics',[]).at(-1),done=G('done_'+date(),false);document.querySelector('#home').innerHTML=`<div class="card"><div class="row between"><div><h2>${new Intl.DateTimeFormat('es-ES',{weekday:'long',day:'numeric',month:'long'}).format(new Date())}</h2><p class="muted">${d?P.wo[d][0]:'Día de recuperación'}</p></div><button onclick="go('training')">Abrir</button></div><p>${done?'✅ Entrenamiento completado':'Pendiente de registrar'}</p></div><div class="card"><h3>Objetivo diario</h3><div class="macro"><div><b>${P.mac.k}</b>kcal</div><div><b>${P.mac.p} g</b>proteína</div><div><b>${P.mac.c} g</b>hidratos</div><div><b>${P.mac.f} g</b>grasas</div></div></div><div class="card"><h3>Último control</h3><p>${m?`${m.w||'—'} kg · cintura ${m.wa||'—'} cm · ${m.dt}`:'Todavía no hay registros.'}</p><button class="secondary" onclick="go('progress')">Añadir medidas</button></div><div class="card"><h3>Horario</h3><div class="timeline">${P.sched.map(x=>`<div><b>${x[0]}</b><br><span class="muted">${x[1]}</span></div>`).join('')}</div></div>`}
function training(day=wd()||1){let w=P.wo[day],log=G(`log_${date()}_${day}`,{});document.querySelector('#training').innerHTML=`<div class="card"><div class="tabs">${[1,2,3,4].map(x=>`<button class="${x===day?'':'secondary'}" onclick="training(${x})">${['','Lun','Mar','Mié','Jue'][x]}</button>`).join('')}</div><h2 style="margin-top:14px">${w[0]}</h2><p class="muted">Calienta 3–5 min y realiza series de aproximación. Sesión objetivo: 55–60 min.</p>${w[1].map((e,i)=>`<div class="exercise"><h3>${e[0]}</h3><p class="muted">${e[1]} series · ${e[2]} reps · RIR ${e[3]}</p>${Array.from({length:e[1]},(_,j)=>{let v=(log[i]||[])[j]||{};return `<div class="set"><b>S${j+1}</b><div><label>kg</label><input value="${v.kg||''}" onchange="saveSet(${day},${i},${j},'kg',this.value)"></div><div><label>reps</label><input value="${v.r||''}" onchange="saveSet(${day},${i},${j},'r',this.value)"></div><div><label>RIR</label><input value="${v.ri??e[3]}" onchange="saveSet(${day},${i},${j},'ri',this.value)"></div></div>`}).join('')}</div>`).join('')}<button class="green" style="margin-top:15px" onclick="S('done_'+date(),true);alert('Sesión guardada')">Finalizar sesión</button></div>`}
function saveSet(day,i,j,f,v){let k=`log_${date()}_${day}`,o=G(k,{});o[i]=o[i]||[];o[i][j]=o[i][j]||{};o[i][j][f]=v;S(k,o)}
function nutrition(){let sel=G('menu_'+date(),{b:0,l:0,s:0,d:0}),titles={b:'Desayuno preentreno',l:'Comida',s:'Merienda',d:'Cena'};document.querySelector('#nutrition').innerHTML=`<div class="card"><h2>Menús intercambiables</h2><p class="muted">El batido postentreno y la barrita de media mañana quedan fijos.</p><button onclick="randomMenu()">Elegir menú aleatorio</button></div>${Object.keys(P.menus).map(c=>`<div class="card"><h2>${titles[c]}</h2>${P.menus[c].map((m,i)=>`<div class="menu ${sel[c]===i?'selected':''}" onclick="pick('${c}',${i})"><b>${m[0]}</b><p class="muted">${m[1]} kcal · P ${m[2]} · C ${m[3]} · G ${m[4]}</p></div>`).join('')}</div>`).join('')}<div class="notice"><b>Fijos:</b> 5 g de creatina después del desayuno; batido postentreno; barrita a media mañana.</div>`}
function pick(c,i){let x=G('menu_'+date(),{});x[c]=i;S('menu_'+date(),x);nutrition()}function randomMenu(){let x={};Object.keys(P.menus).forEach(c=>x[c]=Math.floor(Math.random()*P.menus[c].length));S('menu_'+date(),x);nutrition()}
function progress(){let a=G('metrics',[]);document.querySelector('#progress').innerHTML=`<div class="card"><h2>Nuevo registro</h2><div class="fields">${[['w','Peso kg'],['wa','Cintura cm'],['ch','Pecho cm'],['sh','Hombros cm'],['ar','Brazo cm'],['th','Muslo cm'],['ca','Gemelo cm']].map(x=>`<div><label>${x[1]}</label><input id="m_${x[0]}"></div>`).join('')}</div><label style="margin-top:9px">Notas</label><textarea id="m_no"></textarea><button style="margin-top:9px" onclick="addMetric()">Guardar</button></div><div class="card"><h2>Evolución del peso</h2><canvas id="chart" width="700" height="240"></canvas></div><div class="card"><h2>Historial</h2>${a.slice().reverse().map(x=>`<div class="menu"><b>${x.dt}</b><p class="muted">${x.w||'—'} kg · cintura ${x.wa||'—'} cm · brazo ${x.ar||'—'} cm</p><p>${x.no||''}</p></div>`).join('')||'<p class="muted">Sin registros.</p>'}</div>`;setTimeout(()=>chart(a),0)}
function addMetric(){let o={dt:date()};['w','wa','ch','sh','ar','th','ca'].forEach(k=>o[k]=document.querySelector('#m_'+k).value);o.no=document.querySelector('#m_no').value;let a=G('metrics',[]);a.push(o);S('metrics',a);progress()}function chart(a){let c=document.querySelector('#chart'),x=c.getContext('2d'),v=a.map(z=>+z.w).filter(Boolean);x.clearRect(0,0,c.width,c.height);if(v.length<2){x.font='16px sans-serif';x.fillStyle='#6b7280';x.fillText('Añade al menos dos registros.',50,120);return}let mn=Math.min(...v)-1,mx=Math.max(...v)+1;x.strokeStyle='#2563eb';x.lineWidth=4;x.beginPath();v.forEach((n,i)=>{let px=35+i*(c.width-60)/(v.length-1),py=c.height-25-(n-mn)*(c.height-50)/(mx-mn);i?x.lineTo(px,py):x.moveTo(px,py)});x.stroke()}
function guide(){document.querySelector('#guide').innerHTML=`<div class="card"><h2>Guía técnica</h2><div class="notice">Trabaja con rango sin dolor. Ante dolor articular agudo o pérdida de fuerza, detén el ejercicio y consulta a un profesional.</div></div>${P.guide.map(x=>`<details><summary>${x[0]}</summary><p>${x[1]}</p></details>`).join('')}<div class="card"><h2>Reglas</h2><ol><li>Técnica antes que peso.</li><li>Trabaja normalmente a RIR 1–3.</li><li>Sube carga al completar el rango alto.</li><li>Registra todas las series efectivas.</li><li>Haz medidas y fotos cada 4 semanas.</li></ol><button onclick="exportData()">Exportar copia</button></div>`}function exportData(){let d={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);d[k]=localStorage.getItem(k)}let b=new Blob([JSON.stringify(d,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='recomp10m_'+date()+'.json';a.click()}
home();training();nutrition();progress();guide();if('serviceWorker'in navigator)navigator.serviceWorker.register('sw.js').catch(()=>{});
