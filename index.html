<!doctype html><html lang="es"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f172a"><meta name="apple-mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.json"><link rel="apple-touch-icon" href="icon-192.png">
<title>Recomp 10M v0.2</title>
<style>
:root{--bg:#eef2f7;--card:#fff;--ink:#0f172a;--muted:#64748b;--line:#e2e8f0;--blue:#2563eb;--green:#0f766e;--red:#b91c1c;--shadow:0 8px 26px rgba(15,23,42,.08)}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;padding-bottom:88px}
header{position:sticky;top:0;z-index:10;background:#0f172a;color:#fff;padding:calc(13px + env(safe-area-inset-top)) 16px 13px}header h1{margin:0;font-size:21px}header small{color:#cbd5e1}
main{max-width:780px;margin:auto;padding:13px}.page{display:none}.page.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:15px;margin-bottom:12px;box-shadow:var(--shadow)}
h2,h3{margin:0 0 10px}.muted{color:var(--muted);font-size:13px}.row{display:flex;align-items:center;gap:8px}.between{justify-content:space-between}.wrap{flex-wrap:wrap}
button,.btn{border:0;border-radius:12px;background:var(--blue);color:#fff;padding:10px 12px;font-weight:750;font-size:14px}button.secondary,.btn.secondary{background:#e2e8f0;color:#0f172a}button.green{background:var(--green)}button.red{background:var(--red)}
input,select,textarea{width:100%;padding:10px;border:1px solid #cbd5e1;border-radius:11px;font-size:15px;background:#fff}label{display:block;font-size:12px;font-weight:700;color:#475569;margin:5px 0}
nav{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:7px 5px calc(7px + env(safe-area-inset-bottom));z-index:20}
nav button{background:transparent;color:#64748b;padding:5px;font-size:11px;display:flex;flex-direction:column;gap:3px;align-items:center}nav button.active{color:var(--blue)}.ico{font-size:20px}
.pills{display:flex;gap:7px;overflow:auto;padding-bottom:3px}.pill{white-space:nowrap}.macro{display:grid;grid-template-columns:repeat(4,1fr);gap:7px}.macro div{text-align:center;background:#f8fafc;border:1px solid var(--line);padding:9px;border-radius:12px}.macro b{display:block}
.exercise{border-top:1px solid var(--line);padding-top:12px;margin-top:12px}.setrow{display:grid;grid-template-columns:34px 1fr 1fr 1fr 38px;gap:6px;align-items:end;margin:8px 0}.setrow span{font-weight:800;padding-bottom:11px}
.recipe{border:1px solid var(--line);border-radius:14px;padding:12px;margin-top:9px}.recipe.selected{border:2px solid var(--blue);background:#eff6ff}.recipe h3{font-size:16px}
.badge{display:inline-block;padding:5px 9px;border-radius:999px;background:#dbeafe;color:#1d4ed8;font-size:12px;font-weight:800}.timer{font-size:32px;font-weight:900;text-align:center;padding:12px}.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}@media(max-width:520px){.grid2{grid-template-columns:1fr}}
.photoCompare{position:relative;overflow:hidden;border-radius:14px;background:#cbd5e1;aspect-ratio:3/4}.photoCompare img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.photoCompare .after{clip-path:inset(0 50% 0 0)}
canvas{width:100%;height:220px}.notice{padding:11px;border-left:4px solid #d97706;background:#fffbeb;border-radius:10px;font-size:13px}
details{border:1px solid var(--line);border-radius:12px;padding:10px;margin-top:8px}summary{font-weight:800}
</style></head><body>
<header><h1>Recomp 10M</h1><small>Versión 0.2 · entrenamiento, recetas y progreso</small></header>
<main><section id="home" class="page active"></section><section id="training" class="page"></section><section id="nutrition" class="page"></section><section id="progress" class="page"></section><section id="more" class="page"></section></main>
<nav><button data-p="home" class="active"><span class="ico">🏠</span>Hoy</button><button data-p="training"><span class="ico">🏋️</span>Entreno</button><button data-p="nutrition"><span class="ico">🍽️</span>Recetas</button><button data-p="progress"><span class="ico">📈</span>Progreso</button><button data-p="more"><span class="ico">⚙️</span>Más</button></nav>
<script src="data.js"></script><script>
const S={g:(k,d)=>{try{return JSON.parse(localStorage.getItem(k))??d}catch{return d}},s:(k,v)=>localStorage.setItem(k,JSON.stringify(v))};
const iso=()=>new Date().toISOString().slice(0,10);const wd=()=>{let d=new Date().getDay();return d>=1&&d<=4?String(d):"1"};
function go(p){document.querySelectorAll(".page").forEach(x=>x.classList.toggle("active",x.id===p));document.querySelectorAll("nav button").forEach(x=>x.classList.toggle("active",x.dataset.p===p));({home:rHome,training:rTraining,nutrition:rNutrition,progress:rProgress,more:rMore}[p])();scrollTo(0,0)}
document.querySelectorAll("nav button").forEach(b=>b.onclick=()=>go(b.dataset.p));
function rHome(){let m=S.g("metrics",[]).at(-1),w=WORKOUTS[wd()];home.innerHTML=`<div class=card><span class=badge>Plan de hoy</span><h2 style="margin-top:10px">${w.name}</h2><p class=muted>${w.ex.length} ejercicios · 55–60 min</p><button onclick="go('training')">Abrir entrenamiento</button></div><div class=grid2><div class=card><h3>Macros</h3><div class=macro><div><b>2850</b>kcal</div><div><b>170 g</b>P</div><div><b>360 g</b>C</div><div><b>75 g</b>G</div></div></div><div class=card><h3>Último control</h3><b>${m?.weight||"—"} kg</b><p class=muted>Cintura ${m?.waist||"—"} cm</p><button class=secondary onclick="go('progress')">Añadir control</button></div></div><div class=card><h3>Rutina del día</h3><p>05:15 desayuno + creatina · 06:00 entrenamiento · 07:15 batido · 10:00 barrita · 14:00 comida · 17:30 merienda · 21:00 cena.</p></div>`}
let timerInt=null,timerLeft=0;function startTimer(sec){clearInterval(timerInt);timerLeft=sec;showTimer();timerInt=setInterval(()=>{timerLeft--;showTimer();if(timerLeft<=0){clearInterval(timerInt);navigator.vibrate?.([200,100,200]);alert("Descanso terminado")}},1000)}function showTimer(){let e=document.querySelector("#timer");if(e)e.textContent=`${Math.floor(timerLeft/60)}:${String(timerLeft%60).padStart(2,"0")}`}
function lastFor(name){let out="";Object.keys(localStorage).filter(k=>k.startsWith("log_")).sort().reverse().some(k=>{let o=S.g(k,{});for(let d in WORKOUTS){let i=WORKOUTS[d].ex.findIndex(x=>x[0]===name);if(i>=0&&o[d]?.[i]){out=o[d][i].map((s,j)=>`S${j+1} ${s.kg||"—"}×${s.reps||"—"}`).join(" · ");return true}}return false});return out}
function rTraining(day=wd()){let w=WORKOUTS[day],all=S.g("log_"+iso(),{}),log=all[day]||{};training.innerHTML=`<div class=card><div class=pills>${["1","2","3","4"].map(d=>`<button class="${d===day?"":"secondary"} pill" onclick="rTraining('${d}')">${["","Lun","Mar","Mié","Jue"][+d]}</button>`).join("")}</div><h2 style="margin-top:12px">${w.name}</h2><div id=timer class=timer>0:00</div><div class=row><button class=secondary onclick="startTimer(60)">1:00</button><button class=secondary onclick="startTimer(90)">1:30</button><button class=secondary onclick="startTimer(120)">2:00</button><button class=secondary onclick="startTimer(150)">2:30</button></div>${w.ex.map((e,i)=>`<div class=exercise><h3>${e[0]}</h3><p class=muted>${e[1]} series · ${e[2]} reps · RIR ${e[3]} · descanso ${e[4]} s</p><p class=muted><b>Última vez:</b> ${lastFor(e[0])||"sin datos"}</p>${Array.from({length:e[1]},(_,s)=>{let v=log[i]?.[s]||{};return `<div class=setrow><span>S${s+1}</span><div><label>kg</label><input value="${v.kg||""}" inputmode=decimal onchange="sv('${day}',${i},${s},'kg',this.value)"></div><div><label>reps</label><input value="${v.reps||""}" inputmode=numeric onchange="sv('${day}',${i},${s},'reps',this.value)"></div><div><label>RIR</label><input value="${v.rir??e[3]}" inputmode=numeric onchange="sv('${day}',${i},${s},'rir',this.value)"></div><button class=green onclick="startTimer(${e[4]})">✓</button></div>`}).join("")}<label>Notas</label><input value="${log[i]?.note||""}" onchange="sv('${day}',${i},-1,'note',this.value)" placeholder="Técnica, molestias, sensaciones..."></div>`).join("")}<button class=green onclick="alert('Sesión guardada')">Finalizar sesión</button></div>`}
function sv(d,i,s,f,v){let a=S.g("log_"+iso(),{});a[d]=a[d]||{};a[d][i]=a[d][i]||[];if(s<0)a[d][i].note=v;else{a[d][i][s]=a[d][i][s]||{};a[d][i][s][f]=v}S.s("log_"+iso(),a)}
let cat="breakfast";function rNutrition(){let q=S.g("rq",""),fav=S.g("fav",[]);let list=RECIPES[cat].filter(r=>r[0].toLowerCase().includes(q.toLowerCase())||r[1].join(" ").toLowerCase().includes(q.toLowerCase()));nutrition.innerHTML=`<div class=card><h2>Recetas completas</h2><input placeholder="Buscar receta o ingrediente" value="${q}" oninput="S.s('rq',this.value);rNutrition()"><div class=pills style="margin-top:10px">${[["breakfast","Desayunos"],["lunch","Comidas"],["snack","Meriendas"],["dinner","Cenas"]].map(x=>`<button class="${cat===x[0]?"":"secondary"} pill" onclick="cat='${x[0]}';rNutrition()">${x[1]}</button>`).join("")}</div></div>${list.map((r,i)=>`<div class=card><div class=row between><h3>${r[0]}</h3><button class=secondary onclick="fav('${r[0]}')">${fav.includes(r[0])?"★":"☆"}</button></div><p class=muted>${r[3]} kcal · P ${r[4]} g · C ${r[5]} g · G ${r[6]} g · ${r[7]} min</p><details><summary>Ingredientes y preparación</summary><h4>Ingredientes</h4><ul>${r[1].map(x=>`<li>${x}</li>`).join("")}</ul><h4>Preparación</h4><ol>${r[2].map(x=>`<li>${x}</li>`).join("")}</ol></details></div>`).join("")}`}
function fav(n){let f=S.g("fav",[]);f=f.includes(n)?f.filter(x=>x!==n):[...f,n];S.s("fav",f);rNutrition()}
function rProgress(){let a=S.g("metrics",[]);progress.innerHTML=`<div class=card><h2>Nuevo control</h2><div class=grid2><div><label>Peso kg</label><input id=pw inputmode=decimal></div><div><label>Cintura cm</label><input id=pc inputmode=decimal></div><div><label>Brazo cm</label><input id=pa inputmode=decimal></div><div><label>Muslo cm</label><input id=pm inputmode=decimal></div></div><label>Notas</label><textarea id=pn></textarea><button onclick="addM()">Guardar</button></div><div class=card><h2>Comparador de fotos</h2><div class=grid2><div><label>Antes</label><input type=file accept=image/* onchange="photo(this.files[0],'before')"></div><div><label>Después</label><input type=file accept=image/* onchange="photo(this.files[0],'after')"></div></div><div class=photoCompare id=cmp>${S.g("before",null)?`<img src="${S.g("before")}">`:""}${S.g("after",null)?`<img class=after src="${S.g("after")}">`:""}</div><input type=range min=0 max=100 value=50 oninput="document.querySelector('.after').style.clipPath='inset(0 '+(100-this.value)+'% 0 0)'"><p class=muted>El comparador es visual. El análisis real con IA requerirá conectar un servidor seguro en una versión posterior.</p></div><div class=card><h2>Historial</h2>${a.slice().reverse().map(x=>`<div class=recipe><b>${x.date}</b><p class=muted>${x.weight} kg · cintura ${x.waist} cm · brazo ${x.arm} cm · muslo ${x.thigh} cm</p><p>${x.notes||""}</p></div>`).join("")||"<p class=muted>Sin controles.</p>"}</div>`}
function addM(){let a=S.g("metrics",[]);a.push({date:iso(),weight:pw.value,waist:pc.value,arm:pa.value,thigh:pm.value,notes:pn.value});S.s("metrics",a);rProgress()}
function photo(f,k){if(!f)return;let r=new FileReader();r.onload=()=>{try{S.s(k,r.result);rProgress()}catch{alert("La imagen es demasiado grande para el almacenamiento local.")}};r.readAsDataURL(f)}
function rMore(){more.innerHTML=`<div class=card><h2>Novedades v0.2</h2><ul><li>60 recetas completas con ingredientes y preparación.</li><li>Buscador y favoritos.</li><li>Temporizador de descanso.</li><li>Último entrenamiento visible.</li><li>Notas por ejercicio.</li><li>Comparador antes/después.</li></ul></div><div class=card><h2>Copia de seguridad</h2><div class=row wrap><button onclick=exp()>Exportar datos</button><label class="btn secondary">Importar<input type=file accept=.json onchange=imp(this.files[0]) style=display:none></label></div></div><div class=notice><b>Importante:</b> antes de actualizar versiones, exporta una copia desde aquí.</div>`}
function exp(){let d={};for(let i=0;i<localStorage.length;i++){let k=localStorage.key(i);d[k]=localStorage.getItem(k)}let b=new Blob([JSON.stringify(d)],{type:"application/json"}),a=document.createElement("a");a.href=URL.createObjectURL(b);a.download="recomp-copia-"+iso()+".json";a.click()}
function imp(f){let r=new FileReader();r.onload=()=>{let d=JSON.parse(r.result);Object.entries(d).forEach(([k,v])=>localStorage.setItem(k,v));location.reload()};r.readAsText(f)}
rHome();rTraining();rNutrition();rProgress();rMore();if("serviceWorker"in navigator)navigator.serviceWorker.register("sw.js");
</script></body></html>
