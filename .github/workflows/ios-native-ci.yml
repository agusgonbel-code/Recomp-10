name: Recomp 10 iOS Native CI

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - 'app-store/**'
      - '*.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/build-mobile.mjs'
      - 'scripts/configure-ios-privacy.mjs'
      - '.github/workflows/ios-native-ci.yml'
  push:
    branches:
      - main
    paths:
      - 'index.html'
      - 'privacy.html'
      - 'support.html'
      - 'PrivacyInfo.xcprivacy'
      - 'app-store/**'
      - '*.js'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'capacitor.config.json'
      - 'scripts/build-mobile.mjs'
      - 'scripts/configure-ios-privacy.mjs'
      - '.github/workflows/ios-native-ci.yml'

permissions:
  contents: read

concurrency:
  group: recomp-ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-ios-simulator:
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Verify Xcode and iOS SDK
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild -version
          SDK_VERSION="$(xcrun --sdk iphoneos --show-sdk-version)"
          echo "iPhoneOS SDK: $SDK_VERSION"
          MAJOR="${SDK_VERSION%%.*}"
          test "$MAJOR" -ge 26 || { echo "App Store release requires iOS 26 SDK or newer"; exit 1; }

      - name: Install Capacitor 8
        run: npm install --no-audit --no-fund

      - name: Run application test suite
        run: npm test

      - name: Build bundled web assets
        run: npm run build:mobile

      - name: Generate native iOS project
        run: npx cap add ios

      - name: Install native release identity and privacy manifest
        run: npm run ios:privacy

      - name: Validate Capacitor configuration
        run: npx cap doctor ios

      - name: Compile for iOS Simulator without signing
        shell: bash
        run: |
          set -euo pipefail
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Validate built application identity
        id: app
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find "$HOME/Library/Developer/Xcode/DerivedData" -path '*Build/Products/Release-iphonesimulator/App.app' -print -quit)"
          test -n "$APP_PATH" || { echo 'No simulator .app generated'; exit 1; }
          PLIST="$APP_PATH/Info.plist"
          BUNDLE_ID="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$PLIST")"
          VERSION="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")"
          BUILD="$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")"
          EXPECTED_BUNDLE="$(node -p "require('./app-store/release.json').bundleId")"
          EXPECTED_VERSION="$(node -p "require('./app-store/release.json').marketingVersion")"
          EXPECTED_BUILD="$(node -p "require('./app-store/release.json').buildNumber")"
          test "$BUNDLE_ID" = "$EXPECTED_BUNDLE" || { echo "Unexpected Bundle ID: $BUNDLE_ID"; exit 1; }
          test "$VERSION" = "$EXPECTED_VERSION" || { echo "Unexpected version: $VERSION"; exit 1; }
          test "$BUILD" = "$EXPECTED_BUILD" || { echo "Unexpected build: $BUILD"; exit 1; }
          echo "Bundle ID: $BUNDLE_ID"
          echo "Version: $VERSION ($BUILD)"
          echo "Built app: $APP_PATH"
          du -sh "$APP_PATH"
          echo "path=$APP_PATH" >> "$GITHUB_OUTPUT"

      - name: Validate bundled privacy manifest
        shell: bash
        run: |
          set -euo pipefail
          PRIVACY="${{ steps.app.outputs.path }}/PrivacyInfo.xcprivacy"
          test -f "$PRIVACY" || { echo 'PrivacyInfo.xcprivacy is missing from the built app'; exit 1; }
          plutil -lint "$PRIVACY"
          test "$(/usr/libexec/PlistBuddy -c 'Print :NSPrivacyTracking' "$PRIVACY")" = 'false'
          test "$(plutil -extract NSPrivacyTrackingDomains json -o - "$PRIVACY" | tr -d '[:space:]')" = '[]'
          test "$(plutil -extract NSPrivacyCollectedDataTypes json -o - "$PRIVACY" | tr -d '[:space:]')" = '[]'
          test "$(plutil -extract NSPrivacyAccessedAPITypes json -o - "$PRIVACY" | tr -d '[:space:]')" = '[]'

      - name: Stage simulator application artifact
        shell: bash
        run: |
          set -euo pipefail
          rm -rf artifact
          mkdir artifact
          cp -R "${{ steps.app.outputs.path }}" artifact/Recomp10M.app

      - name: Upload simulator application artifact
        uses: actions/upload-artifact@v4
        with:
          name: Recomp10M-iOS-Simulator-${{ github.sha }}
          path: artifact/Recomp10M.app
          if-no-files-found: error
          retention-days: 14
