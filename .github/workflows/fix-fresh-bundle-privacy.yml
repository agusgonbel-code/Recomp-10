name: Fix fresh bundle privacy

# One-shot repair workflow: edits production HTML, validates privacy and fresh-install safety, then commits verified output.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-fresh-bundle-privacy.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Neutralize development starter data safely
        shell: python
        run: |
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          replacements = {
              "<h1 id='hello'>Hola, Agustín</h1>": "<h1 id='hello'>Hola</h1>",
              "<div class='stat' id='dWeight'>81 kg</div>": "<div class='stat' id='dWeight'>—</div>",
              "<input id='age' type='number' value='46'>": "<input id='age' type='number' inputmode='numeric' min='13' max='100' placeholder='Edad'>",
              "<input id='weight' type='number' value='81'>": "<input id='weight' type='number' inputmode='decimal' min='30' max='300' step='0.1' placeholder='kg'>",
              "<input id='height' type='number' value='181'>": "<input id='height' type='number' inputmode='numeric' min='120' max='230' placeholder='cm'>",
              "<input id='profileName' value='Agustín'>": "<input id='profileName' autocomplete='name' placeholder='Tu nombre'>",
              "S.g('profile',{name:'Agustín'})": "S.g('profile',{name:''})",
              "S.g('targets',{kcal:3014,protein:156,carbs:422,fat:78})": "S.g('targets',{kcal:0,protein:0,carbs:0,fat:0})",
              "'81 kg'": "'—'",
          }
          for old, new in replacements.items():
              s = s.replace(old, new)
          # Avoid NaN/Infinity progress widths until the user has calculated targets.
          s = s.replace(
              "function line(n,v,t){return `<div style='margin:9px 0'><div class='small'>${n}: ${Math.round(v)} / ${t}</div><div class='progress'><div style='width:${Math.min(100,v/t*100)}%'></div></div></div>`}",
              "function line(n,v,t){let target=Number(t)||0,pct=target>0?Math.min(100,Math.max(0,v/target*100)):0;return `<div style='margin:9px 0'><div class='small'>${n}: ${Math.round(v)} / ${target||'—'}</div><div class='progress'><div style='width:${pct}%'></div></div></div>`}"
          )
          p.write_text(s, encoding='utf-8')
      - name: Validate privacy correction and nearby invariants
        run: |
          node --test tests/fresh-bundle-privacy-v64.test.mjs
          node --test tests/persistence.test.mjs
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const forbidden=[/Hola,\s*Agust[ií]n/i,/id=['"]profileName['"][^>]*value=['"]Agust[ií]n['"]/i,/id=['"]dWeight['"]>\s*81\s*kg/i,/id=['"]age['"][^>]*value=['"]46['"]/i,/id=['"]weight['"][^>]*value=['"]81['"]/i,/id=['"]height['"][^>]*value=['"]181['"]/i,/S\.g\(['"]targets['"],\s*\{\s*kcal\s*:\s*3014/i];
          if(forbidden.some(r=>r.test(h))) throw new Error('Personal starter data remains in production HTML');
          if(/NaN%|Infinity%/.test(h)) throw new Error('Unsafe fresh-install progress rendering remains');
          const scripts=[...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(m=>m[1]).filter(s=>s.trim());
          if(scripts.length!==1) throw new Error('Expected one inline application script');
          fs.writeFileSync('/tmp/recomp-app.js',scripts[0]);
          NODE
          node --check /tmp/recomp-app.js
      - name: Commit verified correction
        id: commit
        run: |
          if git diff --quiet -- index.html; then
            echo 'No product change required.'
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name 'recomp-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add index.html
          git commit -m 'Fix neutral fresh-install starter state'
          git push
          echo 'changed=true' >> "$GITHUB_OUTPUT"
      - name: Re-run release gate on exact main bundle
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Commits made with GITHUB_TOKEN do not recursively trigger push workflows.
          # workflow_dispatch is explicitly allowed, so force certification of the
          # exact resulting main bundle whether or not this run changed index.html.
          gh workflow run browser-smoke.yml --ref main
