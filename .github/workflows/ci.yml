name: Recomp 10 CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: recomp-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-pwa:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate manifest
        run: node -e "JSON.parse(require('fs').readFileSync('manifest.webmanifest','utf8'))"

      - name: Validate JavaScript modules
        run: |
          node --check sw.js
          node --check persistence.js
          node --check date-engine.js
          node --check training-engine.js
          node --check nutrition-engine.js
          node --check meal-planner.js
          node --check meal-planner-ui.js
          node --check coach-engine.js
          node --check photo-engine.js

      - name: Test local date safety
        run: node --test tests/date-engine.test.mjs

      - name: Test persistence safety
        run: node --test tests/persistence.test.mjs

      - name: Test training progression
        run: node --test tests/training-engine.test.mjs

      - name: Test nutrition engine
        run: node --test tests/nutrition-engine.test.mjs

      - name: Test meal planner
        run: node --test tests/meal-planner.test.mjs

      - name: Simulate full month nutrition and training
        run: node --test tests/month-simulation.test.mjs

      - name: Simulate production recipe month
        run: node --test tests/production-month.test.mjs

      - name: Test explainable coach
        run: node --test tests/coach-engine.test.mjs

      - name: Test photo engine
        run: node --test tests/photo-engine.test.mjs

      - name: Test PWA update consistency
        run: node --test tests/sw-update.test.mjs

      - name: Test backup download safety
        run: node --test tests/backup-download.test.mjs

      - name: Test App Store release readiness
        run: node --test tests/release-readiness.test.mjs

      - name: Validate inline application script
        shell: bash
        run: |
          node - <<'NODE'
          const html = require('fs').readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].filter(match => match[1].trim());
          if (scripts.length !== 1) throw new Error('Expected exactly one inline application script');
          require('fs').writeFileSync('/tmp/recomp-app.js', scripts[0][1]);
          NODE
          node --check /tmp/recomp-app.js

      - name: Verify PWA shell
        shell: bash
        run: |
          set -euo pipefail
          require_file(){ test -s "$1" || { echo "Missing or empty file: $1"; exit 1; }; }
          require_text(){ local file="$1"; local text="$2"; local label="$3"; grep -Fq "$text" "$file" || { echo "Missing check: $label ($text) in $file"; exit 1; }; }

          for file in index.html privacy.html support.html manifest.webmanifest sw.js persistence.js date-engine.js training-engine.js nutrition-engine.js meal-planner.js meal-planner-ui.js coach-engine.js photo-engine.js icon-192.png icon-512.png; do
            require_file "$file"
          done

          require_text index.html "navigator.serviceWorker.register('./sw.js')" "service worker registration"
          require_text index.html "src='persistence.js'" "persistence script"
          require_text index.html "src='date-engine.js'" "date engine script"
          require_text sw.js "'./date-engine.js'" "date engine cache"
          require_text index.html "src='training-engine.js'" "training engine script"
          require_text index.html "src='nutrition-engine.js'" "nutrition engine script"
          require_text index.html "src='meal-planner.js'" "meal planner script"
          require_text sw.js "'./meal-planner.js'" "meal planner cache"
          require_text index.html "src='meal-planner-ui.js'" "meal planner UI script"
          require_text index.html "recomp:targets-updated" "macro update event"
          require_text meal-planner-ui.js "applyMacroTargets" "macro sync"
          require_text meal-planner-ui.js "recomp10.manualTargets" "manual target persistence"
          require_text meal-planner-ui.js "persistManualTargets" "manual target save"
          require_text meal-planner-ui.js "generateDays" "variable-day generation"
          require_text meal-planner-ui.js 'min="1"' "minimum menu days"
          require_text meal-planner-ui.js 'max="30"' "maximum menu days"
          require_text meal-planner-ui.js "data-recipe" "recipe links"
          require_text meal-planner-ui.js "data-log" "meal log links"
          require_text meal-planner-ui.js "privacy.html" "in-app privacy link"
          require_text meal-planner-ui.js "support.html" "in-app support link"
          require_text sw.js "'./privacy.html'" "privacy offline cache"
          require_text sw.js "'./support.html'" "support offline cache"
          require_text index.html "recomp:log-planned-meal" "planned meal logging event"
          require_text index.html "saveMealEntry" "meal persistence"
          require_text index.html "mealJournalDate" "meal journal date"
          require_text meal-planner-ui.js "recomp:meal-log-changed" "meal log refresh"
          require_text meal-planner-ui.js "mpRecipeDetail" "recipe detail panel"
          require_text index.html "MEAL_PLAN_KEY" "meal plan persistence key"
          require_text index.html ">Menús</button>" "menus navigation"
          node -e "const h=require('fs').readFileSync('index.html','utf8');if(h.indexOf(\"id='mealPlanner30'\")>h.indexOf(\"id='recipeList'\"))throw new Error('El generador debe aparecer antes que las recetas')"
          require_text sw.js "'./meal-planner-ui.js'" "meal planner UI cache"
          require_text index.html "src='coach-engine.js'" "coach engine script"
          require_text sw.js "'./coach-engine.js'" "coach engine cache"
          require_text index.html "src='photo-engine.js'" "photo engine script"
